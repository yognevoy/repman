version: '3.4'

services:
  database:
    env_file: .env.docker.test
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-main}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-main}
      POSTGRES_DB: ${POSTGRES_DB:-test}
    volumes:
      - postgres-test-data:/var/lib/postgresql/data

  app:
    env_file: .env.docker.test

  consumer:
    env_file: .env.docker.test

  cron:
    env_file: .env.docker.test

volumes:
  postgres-test-data:
